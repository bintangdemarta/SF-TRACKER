# Shared compose definition for staging (self-hosted Docker + tunnel) and
# production (VPS). Same stack on both, per the "staging = production
# parity" principle — only the .env file on each host differs.
#
# Usage on target host:
#   docker compose -f docker-compose.deploy.yml --env-file .env.staging up -d
#   docker compose -f docker-compose.deploy.yml --env-file .env.production up -d
#
# IMAGE_TAG is set by the deploy workflow (ghcr.io/<owner>/sf-tracker:<branch>-<sha>).

services:
    app:
        image: '${IMAGE_TAG}'
        restart: unless-stopped
        ports:
            - '${APP_PORT:-8080}:80'
        environment:
            APP_NAME: '${APP_NAME:-SF-Tracker}'
            APP_ENV: '${APP_ENV:-production}'
            APP_KEY: '${APP_KEY}'
            APP_DEBUG: '${APP_DEBUG:-false}'
            APP_URL: '${APP_URL}'
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: '${DB_DATABASE}'
            DB_USERNAME: '${DB_USERNAME:-sf_tracker}'
            DB_PASSWORD: '${DB_PASSWORD}'
            SESSION_DRIVER: database
            QUEUE_CONNECTION: database
            CACHE_STORE: database
            LOG_CHANNEL: stderr
        depends_on:
            mysql:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/up']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 20s

    mysql:
        image: 'mysql:8.0'
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME:-sf_tracker}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'sf-tracker-deploy-mysql-data:/var/lib/mysql'
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD}']
            retries: 5
            timeout: 5s

volumes:
    sf-tracker-deploy-mysql-data:
        driver: local
