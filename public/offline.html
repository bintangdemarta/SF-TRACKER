<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — SF-Tracker</title>
    <style>
        html, body {
            margin: 0; height: 100%;
            background: #0f172a; color: #fff;
            font-family: -apple-system, "Segoe UI", Arial, sans-serif;
            display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 24px; box-sizing: border-box;
        }
        .card { max-width: 360px; }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.5; }
        button {
            margin-top: 20px; background: #10b981; color: #0f172a;
            border: none; border-radius: 8px; padding: 12px 24px;
            font-weight: 700; font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>Gak ada koneksi internet</h1>
        <p>Halaman ini butuh koneksi buat dimuat pertama kali. Sambungkan ulang internet, terus coba lagi.</p>
        <button onclick="location.reload()">Coba Lagi</button>
    </div>
</body>
</html>
