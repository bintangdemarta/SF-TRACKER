name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

jobs:
  lint:
    name: Lint (Pint) & Static Analysis (Larastan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, ctype, fileinfo, mysql
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Pint (code style check)
        run: vendor/bin/pint --test

      - name: Larastan (static analysis)
        run: vendor/bin/phpstan analyse --memory-limit=1G

  test:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, ctype, fileinfo, mysql
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          echo "tag=ghcr.io/${{ github.repository_owner }}/sf-tracker:${GITHUB_REF_NAME}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "moving_tag=ghcr.io/${{ github.repository_owner }}/sf-tracker:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.moving_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/staging' && vars.STAGING_DEPLOY_ENABLED == 'true'
    environment: staging
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}|" .env.staging
            docker compose -f docker-compose.deploy.yml --env-file .env.staging pull
            docker compose -f docker-compose.deploy.yml --env-file .env.staging up -d
            docker compose -f docker-compose.deploy.yml --env-file .env.staging exec -T app php artisan migrate --force
            sleep 5
            APP_PORT=$(grep '^APP_PORT=' .env.staging | cut -d= -f2)
            curl -sf "http://127.0.0.1:${APP_PORT:-8080}/up"

  deploy-production:
    name: Deploy to Production
    runs-on: [self-hosted, linux, x64, sf-tracker-production]
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deployment files
        run: |
          set -euo pipefail
          mkdir -p "${{ vars.PRODUCTION_DEPLOY_PATH || '/home/sftracker/sf-tracker-production' }}"
          cp docker-compose.deploy.yml "${{ vars.PRODUCTION_DEPLOY_PATH || '/home/sftracker/sf-tracker-production' }}/docker-compose.deploy.yml"

      - name: Deploy local Docker stack
        working-directory: ${{ vars.PRODUCTION_DEPLOY_PATH || '/home/sftracker/sf-tracker-production' }}
        run: |
          set -euo pipefail
          test -f .env.production
          sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}|" .env.production
          docker compose -f docker-compose.deploy.yml --env-file .env.production pull
          docker compose -f docker-compose.deploy.yml --env-file .env.production up -d
          docker compose -f docker-compose.deploy.yml --env-file .env.production exec -T app php artisan migrate --force
          docker compose -f docker-compose.deploy.yml --env-file .env.production exec -T app php artisan db:seed --class=ExpenseCategorySeeder --force
          APP_PORT=$(grep '^APP_PORT=' .env.production | cut -d= -f2)
          curl -sf "http://127.0.0.1:${APP_PORT:-8080}/up"
