services:
    mysql:
        image: 'mysql:8.0'
        container_name: sf-tracker-mysql
        restart: unless-stopped
        ports:
            - '${FORWARD_DB_PORT:-33061}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
        volumes:
            - 'sf-tracker-mysql-data:/var/lib/mysql'
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 5
            timeout: 5s

volumes:
    sf-tracker-mysql-data:
        driver: local
