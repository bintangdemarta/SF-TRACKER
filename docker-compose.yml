services:
    app:
        build:
            context: .
            target: app
        container_name: sf-tracker-app
        restart: unless-stopped
        ports:
            - '${APP_PORT:-8080}:80'
        environment:
            APP_NAME: '${APP_NAME:-SF-Tracker}'
            APP_ENV: '${APP_ENV:-local}'
            APP_KEY: '${APP_KEY}'
            APP_DEBUG: '${APP_DEBUG:-true}'
            APP_URL: '${APP_URL:-http://localhost:8080}'
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: '${DB_DATABASE}'
            DB_USERNAME: '${DB_USERNAME:-sf_tracker}'
            DB_PASSWORD: '${DB_PASSWORD}'
            SESSION_DRIVER: database
            QUEUE_CONNECTION: database
            CACHE_STORE: database
            LOG_CHANNEL: stderr
        depends_on:
            mysql:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/up']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 20s

    mysql:
        image: 'mysql:8.0'
        container_name: sf-tracker-mysql
        restart: unless-stopped
        ports:
            - '${FORWARD_DB_PORT:-33061}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME:-sf_tracker}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'sf-tracker-mysql-data:/var/lib/mysql'
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 5
            timeout: 5s

volumes:
    sf-tracker-mysql-data:
        driver: local
